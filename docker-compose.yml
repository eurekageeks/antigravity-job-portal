version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: a1ti-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: firstjobdb
      MYSQL_USER: firstjob
      MYSQL_PASSWORD: firstjob123

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./backend

    container_name: a1ti-backend

    restart: always

    depends_on:
      - mysql

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend

    container_name: a1ti-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:3000"

    environment:
      VITE_API_URL: http://100.23.94.137:5000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql-data: